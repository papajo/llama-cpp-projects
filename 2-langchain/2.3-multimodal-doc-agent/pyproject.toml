[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llamacpp-multimodal-agent"
version = "0.1.0"
description = "Fully local multimodal document agent using llama.cpp vision — ingest PDFs, screenshots, and images with a vision GGUF model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llama.cpp", "multimodal", "vision", "document-qa", "langchain", "local"]
authors = [
    {name = "llamacpp Multimodal Agent Contributors"},
]
dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "Pillow>=10.0",
    "pypdf>=4.0",
]
