; Sample --models-preset for a full-stack local AI pipeline
;   coder  — code generation (fast, small)
;   chat   — creative writing / general chat (big)
;   embed  — embeddings for RAG (fast, tiny)
;   review — code review specialist (medium LoRA or tuned GGUF)

[coder:Qwen2.5-7B-Q4_K_M]
model = /models/qwen2.5-7b-q4_k_m.gguf
tags = code, generation, fast
description = Lightweight 7B coder — fast on CPU
cold_start_seconds = 3

[chat:Llama-3.1-70B-Q3_K_L]
model = /models/llama-3.1-70b-q3_k_l.gguf
tags = chat, creative, slow, deep
description = Full 70B creative model — best quality
cold_start_seconds = 15

[embedder:all-MiniLM-L6-v2]
model = /models/all-MiniLM-L6-v2.Q4_0.gguf
tags = embedding, fast, tiny
description = Sentence embedding — no generation; for RAG ingestion
cold_start_seconds = 1

[review:CodeQwen1.5-7B-Q4_K_M]
model = /models/codeqwen-1.5-7b-q4_k_m.gguf
tags = code, review, audit, fast
description = Code review specialist — finds bugs and suggests refactors
cold_start_seconds = 3
