[project]
name = "sampler-ablation-lab"
version = "0.1.0"
description = "Run the same prompt through different sampler configurations and compare outputs side-by-side"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
