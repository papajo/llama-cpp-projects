[project]
name = "reasoning-budget-sweep"
version = "0.1.0"
description = "Sweep inference budgets (max_tokens, temperature, top-p, etc.) and measure impact on LLM output quality and efficiency"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
