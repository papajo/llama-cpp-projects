[project]
name = "chat-template-tester"
version = "0.1.0"
description = "Test and compare LLM chat templates side-by-side"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "chat_template_tester"]
