[project]
name = "embedding-norm-ablation"
version = "0.1.0"
description = "Ablation study of embedding normalization effects on vector retrieval quality"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
