[project]
name = "multi-tenant-rag"
version = "0.1.0"
description = "Multi-tenant document isolation and retrieval for RAG systems"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
