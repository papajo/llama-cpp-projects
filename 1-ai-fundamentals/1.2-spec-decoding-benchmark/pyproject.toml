[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-decoding-benchmark"
version = "1.0.0"
description = "Speculative Decoding Strategy Benchmark Suite for llama.cpp"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["llama.cpp", "speculative-decoding", "benchmark", "llm-inference"]

dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "plotly>=5.18",
    "pandas>=2.0",
]

[project.scripts]
spec-bench = "harness.cli:main"
