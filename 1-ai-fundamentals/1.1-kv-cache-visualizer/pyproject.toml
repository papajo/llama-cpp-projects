[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-visualizer"
version = "1.0.0"
description = "KV Cache Memory Calculator & Visualizer for llama.cpp"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["llama.cpp", "kv-cache", "llm", "transformer", "memory-calculator"]
authors = [
    {name = "KV Cache Visualizer Contributors"},
]

dependencies = [
    "numpy>=1.24",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.scripts]
kv-cache = "calculator.cli:main"
