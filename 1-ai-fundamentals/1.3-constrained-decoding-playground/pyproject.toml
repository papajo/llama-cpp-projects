[project]
name = "constrained-decoding-playground"
version = "1.0.0"
description = "Visualise how grammar/JSON-schema constraints affect llama.cpp token generation"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.scripts]
constrained-decode = "backend.server:main"
